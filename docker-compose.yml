services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - bandcamp_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/bandcamp.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bandcamp_data:
